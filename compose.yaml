services:
  gamegenrepopularity-airflow:
    image: gamegenrepopularity-airflow:latest

    environment:
      - PYTHONPATH=/opt/airflow:${PYTHONPATH}
    volumes:
      - ./airflow:/opt/airflow
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
    
    env_file: ./.env
    
    ports:
      - "8080:8080"
    
    command: airflow standalone